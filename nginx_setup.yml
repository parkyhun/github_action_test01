- name: Hello world deploy
  hosts: all
  become: yes 
  tasks:
    - name: Install nginx
      dnf:
        name: nginx
        state: present

    - name: Create web page        
      copy:
        content: "<h1>Hello world from GitHub Actions</h1>"
        dest: /usr/share/nginx/html/index.html

    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes